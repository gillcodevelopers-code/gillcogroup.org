# ============================================================
# NGINX site for Gillco Group (template — deploy-vps.sh fills in
# __SERVER_NAMES__ and __APP_DIR__). Certbot adds the HTTPS part
# automatically, so this file starts as plain HTTP.
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Brochures / images / videos uploaded from the Admin CMS
    client_max_body_size 50M;

    # Uploaded media — served straight from disk (persists across redeploys)
    location /uploads/ {
        alias __APP_DIR__/public/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Next.js build assets
    location /_next/static/ {
        alias __APP_DIR__/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never expose the cron endpoint publicly (the server calls it locally)
    location = /api/cron/escalate {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
