# ============================================================
# NGINX config for Hostinger VPS (or any Ubuntu server)
# Save this to: /etc/nginx/sites-available/gillcogroup
# Then: ln -s /etc/nginx/sites-available/gillcogroup /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
# ============================================================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gillcogroup.org www.gillcogroup.org;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gillcogroup.org www.gillcogroup.org;

    # SSL (managed by certbot --nginx -d gillcogroup.org -d www.gillcogroup.org)
    ssl_certificate     /etc/letsencrypt/live/gillcogroup.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gillcogroup.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Gzip / Brotli
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # File upload limit (brochures, videos)
    client_max_body_size 50M;

    # Serve static uploads directly (bypass Node for speed)
    location /uploads/ {
        alias /var/www/gillco/public/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Next.js static assets
    location /_next/static/ {
        alias /var/www/gillco/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
